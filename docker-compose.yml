version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: commerce_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commerce_ai_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/commerce_ai?schema=public
      JWT_ACCESS_SECRET: dev_access_secret_key_super_secure_32chars
      JWT_REFRESH_SECRET: dev_refresh_secret_key_super_secure_32chars
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commerce_ai_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    depends_on:
      - backend

volumes:
  postgres_data:
